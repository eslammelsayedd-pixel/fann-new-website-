<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>Page not found | FANN</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #1a1a1a; color: #e5e5e5; font-family: 'Manrope', sans-serif; }
        section { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 8rem 1.5rem 5rem; text-align: center; }
        .wrap { max-width: 36rem; margin: 0 auto; }
        .code { color: #c9a227; letter-spacing: .35em; font-size: .875rem; margin-bottom: 1rem; }
        h1 { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 2.5rem; color: #fff; margin: 0 0 1.5rem; }
        p.sub { color: #9ca3af; margin-bottom: 2.5rem; line-height: 1.6; }
        .links { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
        a.btn { padding: .75rem 1.5rem; font-weight: 600; text-decoration: none; border-radius: 2px; }
        a.primary { background: #c9a227; color: #000; }
        a.ghost { border: 1px solid rgba(255,255,255,.2); color: #fff; }
    </style>
</head>
<body>
    <section>
        <div class="wrap">
            <p class="code">404</p>
            <h1>This page doesn't exist</h1>
            <p class="sub">The link may be old or mistyped. Here are the best places to start:</p>
            <div class="links">
                <a class="btn primary" href="/">Home</a>
                <a class="btn ghost" href="/services">Services</a>
                <a class="btn ghost" href="/portfolio">Portfolio</a>
                <a class="btn ghost" href="/contact">Contact</a>
            </div>
        </div>
    </section>
</body>
